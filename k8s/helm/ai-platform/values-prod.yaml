backend:
  replicas: 2
  corsOrigins: "http://prod.ai.local"
  image:
    tag: "local"

frontend:
  replicas: 2
  image:
    tag: "local"

ingress:
  host: prod.ai.local

postgres:
  storageSize: 5Gi

qdrant:
  storageSize: 5Gi

resourceQuota:
  requestsCpu: "4"
  requestsMemory: 8Gi
  limitsCpu: "8"
  limitsMemory: 16Gi
  maxPods: 30

vault:
  role: prod-backend
  secretPath: secret/data/prod/backend
  postgresRole: prod-postgres