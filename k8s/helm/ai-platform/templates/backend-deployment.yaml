apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "{{ .Values.vault.role }}"
        vault.hashicorp.com/agent-inject-secret-config: "{{ .Values.vault.secretPath }}"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ "{{-" }} with secret "{{ .Values.vault.secretPath }}" {{ "-}}" }}
          {{ "{{-" }} range $k, $v := .Data.data {{ "}}" }}
          export {{ "{{" }} $k {{ "}}" }}="{{ "{{" }} $v {{ "}}" }}"
          {{ "{{-" }} end {{ "-}}" }}
          {{ "{{-" }} end {{ "-}}" }}
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins | quote }}
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_DB
              value: {{ .Values.postgres.dbName | quote }}
            - name: QDRANT_HOST
              value: "qdrant"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 15