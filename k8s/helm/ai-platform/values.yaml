backend:
  image: ai-backend:local
  imagePullPolicy: Never
  containerPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

frontend:
  image: ai-frontend:local
  imagePullPolicy: Never
  containerPort: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image: postgres:16-alpine
  containerPort: 5432
  dbName: aegis
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

qdrant:
  image: qdrant/qdrant:v1.18.2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi