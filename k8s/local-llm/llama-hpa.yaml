apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llama-local
  namespace: local-llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-local
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Pods
      pods:
        metric:
          name: gpu_utilization
        target:
          type: AverageValue
          averageValue: "80"