apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-local
  namespace: local-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-local
  template:
    metadata:
      labels:
        app: llama-local
    spec:
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: llama-gpu:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 20