customRules:
  ai-platform-custom-rules.yaml: |-
    - rule: Curl or Wget Executed in Container
      desc: Detects execution of curl or wget inside a container, often used to download payloads or exfiltrate data.
      condition: >
        spawned_process and container and
        proc.name in (curl, wget)
      output: >
        Network tool executed in container (user=%user.name command=%proc.cmdline
        container=%container.name image=%container.image.repository pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [container, network, mitre_command_and_control]

    - rule: Kubernetes ServiceAccount Token Read
      desc: Detects a process reading the Kubernetes ServiceAccount token, often a sign of credential theft.
      condition: >
        open_read and container and
        fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount and
        not proc.name in (vault-agent, vault)
      output: >
        ServiceAccount token read (user=%user.name command=%proc.cmdline file=%fd.name
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [container, k8s, credential_access]

    - rule: Suspicious Host Path Access
      desc: Detects a container accessing sensitive host paths (docker.sock, mounted /host, another process's root via /proc).
      condition: >
        open_read and container and
        (fd.name in (/var/run/docker.sock, /run/docker.sock) or
         fd.name startswith /host or
         fd.name glob "/proc/*/root/etc/*")
      output: >
        Suspicious host path accessed (user=%user.name command=%proc.cmdline file=%fd.name
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: CRITICAL
      tags: [container, host, privilege_escalation]

    - rule: Container Escape Attempt Indicator
      desc: Detects classic escape indicators - writing to cgroup release_agent (CVE-2022-0492 style) or launching nsenter/unshare.
      condition: >
        container and
        (
          (open_write and fd.name glob "*/release_agent") or
          (spawned_process and proc.name in (nsenter, unshare))
        )
      output: >
        Possible container escape attempt (user=%user.name command=%proc.cmdline file=%fd.name
        container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: CRITICAL
      tags: [container, escape, privilege_escalation, T1611]