apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-llm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/amirhosssein0/ai-platform-lab.git
    targetRevision: develop
    path: k8s/local-llm
  destination:
    server: https://kubernetes.default.svc
    namespace: local-llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true